services:
  - type: web
    name: prevora-sif-sentinel
    runtime: python
    region: singapore   # closest to India
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        value: ""        # leave blank → uses SQLite (auto-seeded on startup)
    healthCheckPath: /health
